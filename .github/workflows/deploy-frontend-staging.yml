name: Deploy Frontend (Staging)

on:
  push:
    branches: [staging]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend-staging.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build
        working-directory: frontend
        run: |
          npm ci
          npm run build
        env:
          VITE_API_BASE_URL: https://staging-pulsecontrol-api.yvonnegichovi.com/api

      - name: Deploy to cPanel via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME_STAGING }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD_STAGING }}
          protocol: ftps
          local-dir: frontend/dist/
