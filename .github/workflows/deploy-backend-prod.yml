name: Deploy Backend (Production)

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.cpanel.yml'
      - '.github/workflows/deploy-backend-prod.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger cPanel Git pull + deploy
        env:
          REPO_PATH: ${{ secrets.CPANEL_BACKEND_REPO_PATH_PROD }}
          AUTH: cpanel ${{ secrets.CPANEL_USER }}:${{ secrets.CPANEL_API_TOKEN }}
          HOST: ${{ secrets.CPANEL_HOST }}
        run: |
          curl -sf "https://$HOST:2083/execute/Git/update?repository_root=$REPO_PATH" -H "Authorization: $AUTH"
          curl -sf "https://$HOST:2083/execute/Git/deploy?repository_root=$REPO_PATH" -H "Authorization: $AUTH"
