---
deployment:
  tasks:
    - |
      DEPLOYPATH="/home/yvonneg6/dev-pulsecontrol-api.yvonnegichovi.com"
      VENV_PATH="/home/yvonneg6/virtualenv/dev-pulsecontrol-api.yvonnegichovi.com/3.11/bin"

      echo "========================================"
      echo "Starting DEVELOPMENT deployment"
      echo "Deploy path: $DEPLOYPATH"
      echo "========================================"

      # Deploy Django application files from backend/
      rsync -avz --ignore-times \
        backend/ \
        "$DEPLOYPATH/"

      echo "Installing Python dependencies..."
      "$VENV_PATH/pip" install --upgrade pip
      "$VENV_PATH/pip" install -r "$DEPLOYPATH/requirements.txt"

      echo "Running database migrations..."
      "$VENV_PATH/python" "$DEPLOYPATH/manage.py" migrate --noinput

      echo "Collecting static files..."
      "$VENV_PATH/python" "$DEPLOYPATH/manage.py" collectstatic --noinput

      echo "Restarting Passenger application..."
      mkdir -p "$DEPLOYPATH/tmp"
      touch "$DEPLOYPATH/tmp/restart.txt"

      echo "========================================"
      echo "DEVELOPMENT deployment completed"
      echo "========================================"
