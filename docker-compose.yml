services:

  db:
    image: postgres:16

    container_name: boilerplate-db

    restart: unless-stopped

    environment:
      POSTGRES_DB: boilerplate
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

    container_name: boilerplate-redis

    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend

    container_name: boilerplate-backend

    command: python manage.py runserver 0.0.0.0:8000

    volumes:
      - ./backend:/app

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      FLOWER_INTERNAL_URL: http://flower:5555

    depends_on:
      - db
      - redis
      - flower

  celery-worker:
    build:
      context: ./backend

    container_name: boilerplate-celery-worker

    command: celery -A core worker -l info

    volumes:
      - ./backend:/app

    env_file:
      - .env

    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0

    depends_on:
      - db
      - redis

  celery-beat:
    build:
      context: ./backend

    container_name: boilerplate-celery-beat

    command: celery -A core beat -l info

    volumes:
      - ./backend:/app

    env_file:
      - .env

    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0

    depends_on:
      - db
      - redis

  flower:
    build:
      context: ./backend

    container_name: boilerplate-flower

    command: celery -A core flower --port=5555 --url_prefix=flower
    
    env_file:
      - .env

    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      FLOWER_BASIC_AUTH: ${FLOWER_BASIC_AUTH:-}

    depends_on:
      - redis
      - celery-worker

  frontend:
    build:
      context: ./frontend

    container_name: boilerplate-frontend

    command: npm run dev -- --host

    volumes:
      - ./frontend:/app
      - /app/node_modules

    ports:
      - "5173:5173"

    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
